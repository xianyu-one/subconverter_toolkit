mihomo:
  api: http://127.0.0.1:9090
  secret: ""
database:
  path: observer.db
reporting_timezone: Asia/Taipei
collector:
  enabled: true
  interval_ms: 1000
analyzer:
  enabled: true
retention:
  raw_connections_days: 14
  hourly_stats_days: 180
  daily_stats_days: 0
web:
  listen: 127.0.0.1:8080
  password: change-this-password
# Observer 所在設備上的離線 MMDB；留空時位置顯示未知。
geoip:
  mmdb_path: ""
map:
  origin:
    country: "" # ISO 3166-1，例如 TW
    region: ""  # ISO 3166-2，例如 TW-TPE
  # 名稱須與 Mihomo /proxies 完全一致；入口與出口分開指定。
  nodes: {}
