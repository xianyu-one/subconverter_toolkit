name: Subconverter Docker Build

on:
  push:
    branches: [main]
    paths:
      - "subconverter/Dockerfile"
      - "subconverter/.dockerignore"
      - "subconverter/*.ini"
      - "subconverter/server_conf/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "subconverter/Dockerfile"
      - "subconverter/.dockerignore"
      - "subconverter/*.ini"
      - "subconverter/server_conf/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get subconverter release version
        if: github.event_name != 'pull_request'
        id: get-version
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/tindy2013/subconverter/releases/latest | jq -er .tag_name)
          echo "version=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./subconverter
          file: ./subconverter/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/arm64,linux/amd64
          tags: |
            mrxianyu/subconverter:latest
            mrxianyu/subconverter:${{ steps.get-version.outputs.version || format('sha-{0}', github.sha) }}

      - name: Docker Hub Description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mrxianyu/subconverter
          readme-filepath: ./README.md
          short-description: ${{ github.event.repository.description }}
