name: GeoX Sync Docker Build

on:
  push:
    branches: [main]
    paths:
      - "geox-sync/**"
      - ".github/workflows/geox-sync-build.yml"
  pull_request:
    paths:
      - "geox-sync/**"
      - ".github/workflows/geox-sync-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify multi-platform build
        if: github.event_name == 'pull_request'
        run: make -C geox-sync docker-multi IMAGE_TAGS=mrxianyu/geox-sync:pr

      - name: Build and push geox-sync
        if: github.event_name != 'pull_request'
        run: make -C geox-sync docker-push IMAGE_TAGS="mrxianyu/geox-sync:latest mrxianyu/geox-sync:sha-${{ github.sha }}"
