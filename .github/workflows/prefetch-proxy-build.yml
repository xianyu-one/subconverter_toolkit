name: Prefetch Proxy Docker Build

on:
  push:
    branches: [main]
    paths:
      - "prefetch-proxy/Dockerfile"
      - "prefetch-proxy/.dockerignore"
      - "prefetch-proxy/go.mod"
      - "prefetch-proxy/go.sum"
      - "prefetch-proxy/*.go"
      - "prefetch-proxy/internal/**"
      - ".github/workflows/prefetch-proxy-build.yml"
  pull_request:
    paths:
      - "prefetch-proxy/Dockerfile"
      - "prefetch-proxy/.dockerignore"
      - "prefetch-proxy/go.mod"
      - "prefetch-proxy/go.sum"
      - "prefetch-proxy/*.go"
      - "prefetch-proxy/internal/**"
      - ".github/workflows/prefetch-proxy-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push prefetch-proxy
        uses: docker/build-push-action@v6
        with:
          context: ./prefetch-proxy
          file: ./prefetch-proxy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            mrxianyu/prefetch-proxy:latest
            mrxianyu/prefetch-proxy:sha-${{ github.sha }}
